plugins {
    id 'com.android.application'
}

def webRoot = rootProject.projectDir.parentFile

def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')

// Chave estável FORA do repositório: APKs novos são assinados com a mesma chave (atualização sem desinstalar).
def t2Keystore = new File(System.getProperty('user.home'), '.android-keys/placar-t2.keystore')

tasks.register('syncWebAssets', Sync) {
    from(webRoot) {
        include 't2.html', 't2.js', 't2.css', 't2-engine.js', 't2-state.js', 't2-fetchq.js', 't2-sim.js', 't2-tse.js', 'styles.css', 'manifest-t2.webmanifest'
        include 'assets/**'
        include 'data/t2/base-2026-1t.json', 'data/t2/prior-2022.json', 'data/t2/fallback-2022.json', 'data/t2/curva-2026-1t.json'
        into 'www'
    }
    into generatedWebAssets
}

android {
    namespace 'br.com.lucasgasparino.placar'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.lucasgasparino.placar.t2'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '2T-1.4.2'
        manifestPlaceholders = [appLabel: 'Placar 2T', startPage: 't2.html']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir generatedWebAssets
    }

    signingConfigs {
        placarT2 {
            storeFile t2Keystore
            storePassword 'placart2'
            keyAlias 'placart2'
            keyPassword 'placart2'
        }
    }

    buildTypes {
        debug {
            if (t2Keystore.exists()) signingConfig signingConfigs.placarT2
        }
        release {
            minifyEnabled false
            if (t2Keystore.exists()) signingConfig signingConfigs.placarT2
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
